<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Round 6 — motion</title>
<style>
  :root {
    --sans: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
    --gutter:16px; --ink:#0f172a; --body:#475569; --mute:#64748b; --faint:#94a3b8;
    --line:#e6e8ec; --line2:#eff1f5; --brand:#1f4ed8; --brand-bg:#eef2ff;
    --red:#b91c1c; --red-dot:#dc2626; --green:#166534; --green-bg:#dcfce7; --green-dot:#16a34a;
    --amber:#92400e; --amber-bg:#fef3c7; --violet:#5b21b6; --violet-bg:#ede9fe;
    --shadow:0 1px 2px rgba(15,23,42,.05), 0 6px 16px -8px rgba(15,23,42,.16);
  }
  *, *::before, *::after { box-sizing:border-box; }
  body { margin:0; padding:28px 20px 56px; background:#f2f2f0; font-family:var(--sans); color:var(--body); }
  .wrap { max-width:820px; margin:0 auto; display:flex; flex-direction:column; gap:30px; }
  .labrow { display:flex; align-items:center; gap:12px; margin:0 0 10px; }
  .lab { display:inline-block; background:#dededa; color:#1a1a1a; font-size:12px; font-weight:700;
         letter-spacing:.08em; padding:5px 12px; border-radius:3px; }
  .replay { font:inherit; font-size:11px; font-weight:600; letter-spacing:.04em; text-transform:uppercase;
            color:var(--brand); background:#fff; border:1px solid #dcdfe3; border-radius:999px;
            padding:5px 13px; cursor:pointer; }
  .replay:hover { background:var(--brand-bg); }

  /* ---------- shared static design (your five picks, unchanged) ---------- */
  .shell { background:#fbfbfa; border:1px solid #e7e7e4; border-radius:14px; padding:var(--gutter); }
  .aligned { padding-left:var(--gutter); padding-right:var(--gutter); }
  header { display:flex; align-items:baseline; justify-content:space-between; margin-bottom:18px; }
  header h1 { margin:0; font-family:var(--serif); font-size:18px; font-weight:600; color:var(--ink); letter-spacing:-.01em; }
  header .meta { font-size:11px; color:var(--mute); font-variant-numeric:tabular-nums; }
  .eyebrow { font-size:10px; text-transform:uppercase; letter-spacing:.08em; font-weight:600; }
  .top { display:grid; grid-template-columns:1.85fr 1fr; gap:10px; margin-bottom:10px; align-items:start; }
  .card { background:#fff; border-radius:12px; box-shadow:var(--shadow); }
  .lead { padding:14px var(--gutter) 15px; background:linear-gradient(165deg,#f4f7ff 0%,#fff 62%);
          cursor:pointer; text-align:left; width:100%; border:none; font:inherit; display:block; }
  .lead .eyebrow { color:var(--brand); }
  .amount { font-family:var(--serif); font-size:40px; font-weight:600; color:var(--ink);
            line-height:1; letter-spacing:-.025em; margin:7px 0 5px; font-variant-numeric:tabular-nums; }
  .delta { font-size:11.5px; color:var(--red); font-weight:600; font-variant-numeric:tabular-nums; }
  .delta span { color:var(--mute); font-weight:400; }
  .affordance { margin-top:12px; font-size:10px; text-transform:uppercase; letter-spacing:.08em;
                font-weight:600; color:var(--brand); }
  .side { display:flex; flex-direction:column; gap:10px; }
  .side .card { padding:11px var(--gutter); display:flex; align-items:baseline; justify-content:space-between; gap:10px; }
  .side .eyebrow { color:var(--mute); }
  .side .note { display:block; font-size:10px; color:var(--faint); text-transform:none; letter-spacing:0; font-weight:400; margin-top:3px; }
  .side .val { font-family:var(--serif); font-size:17px; font-weight:600; color:var(--ink); font-variant-numeric:tabular-nums; }
  .breakdown { padding:13px var(--gutter) 14px; margin-bottom:10px; overflow:hidden; }
  .breakdown .eyebrow { color:var(--mute); margin-bottom:11px; }
  .split { display:flex; height:6px; border-radius:3px; overflow:hidden; }
  .split i { display:block; }
  .legend { display:flex; flex-wrap:wrap; gap:12px; margin-top:8px; font-size:10.5px; color:var(--mute); font-variant-numeric:tabular-nums; }
  .legend b { color:var(--ink); font-weight:600; margin-left:4px; }
  .swatch { display:inline-block; width:7px; height:7px; border-radius:2px; margin-right:5px; }
  .sectionbar { display:flex; align-items:baseline; justify-content:space-between; margin:16px 0 7px; }
  .sectionbar .eyebrow { color:var(--brand); }
  .sectionbar .hint { font-size:10.5px; color:var(--faint); }
  .tablecard { padding:5px 0 6px; }
  table { width:100%; border-collapse:collapse; font-size:12.5px; }
  th { text-align:left; font-size:10px; text-transform:uppercase; letter-spacing:.08em; font-weight:600; color:var(--mute); padding:7px 8px; }
  td { padding:7px 8px; color:var(--body); font-variant-numeric:tabular-nums; border-top:1px solid var(--line2); }
  thead th { border-bottom:1px solid var(--line); }
  tbody tr:first-child td { border-top:none; }
  th:first-child, td:first-child { padding-left:var(--gutter); }
  th:last-child, td:last-child { padding-right:var(--gutter); text-align:right; }
  td.svc { font-family:var(--serif); font-size:13.5px; font-weight:600; color:var(--ink); }
  td.amt { color:var(--ink); font-weight:600; }
  tr.due td { background:#fffaf2; }
  tr.due td.when { color:var(--amber); font-weight:600; }
  .dot { display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:8px; vertical-align:middle; background:var(--green-dot); }
  .dot.due { background:var(--red-dot); }
  .tag { display:inline-block; font-size:10px; padding:2px 8px; border-radius:999px; margin-left:7px; vertical-align:1px; background:var(--brand-bg); color:var(--brand); }
  .tag.infra { background:var(--amber-bg); color:var(--amber); }
  .tag.home { background:var(--green-bg); color:var(--green); }
  .tag.work { background:var(--violet-bg); color:var(--violet); }

  /* ================= VARIANT A : minimal, functional motion ================= */
  .A .card, .A tbody tr { opacity:0; }
  .A.run .card, .A.run tbody tr { animation:aIn 140ms ease-out forwards; }
  @keyframes aIn { from { opacity:0; transform:translateY(3px); } to { opacity:1; transform:none; } }
  .A tbody tr { transition:background 90ms linear; }
  .A tbody tr:hover td { background:#f6f8fb; }
  .A tr.due:hover td { background:#fff3e2; }
  .A .card { transition:box-shadow 100ms linear; }
  .A .breakdown[hidden] { display:none; }
  .A .breakdown { animation:aIn 120ms ease-out forwards; }
  .A .replayable { }

  /* ================= VARIANT B : expressive, choreographed ================= */
  .B .card, .B tbody tr { opacity:0; }
  .B.run .card, .B.run tbody tr { animation:bIn 520ms cubic-bezier(.16,1,.3,1) forwards; }
  @keyframes bIn { from { opacity:0; transform:translateY(16px) scale(.985); } to { opacity:1; transform:none; } }
  .B.run .lead      { animation-delay:0ms; }
  .B.run .side .card:nth-child(1) { animation-delay:90ms; }
  .B.run .side .card:nth-child(2) { animation-delay:160ms; }
  .B.run .tablecard { animation-delay:230ms; }
  .B.run tbody tr:nth-child(1) { animation-delay:300ms; }
  .B.run tbody tr:nth-child(2) { animation-delay:360ms; }
  .B.run tbody tr:nth-child(3) { animation-delay:420ms; }
  .B.run tbody tr:nth-child(4) { animation-delay:480ms; }
  .B.run tbody tr:nth-child(5) { animation-delay:540ms; }
  .B tbody tr { transition:transform 260ms cubic-bezier(.16,1,.3,1), background 260ms ease; }
  .B tbody tr:hover { transform:translateX(4px); }
  .B tbody tr:hover td { background:#f6f8fb; }
  .B .card { transition:transform 300ms cubic-bezier(.16,1,.3,1), box-shadow 300ms ease; }
  .B .lead:hover { transform:translateY(-3px); box-shadow:0 2px 4px rgba(15,23,42,.06), 0 14px 30px -12px rgba(15,23,42,.3); }
  .B .breakdown[hidden] { display:none; }
  .B .breakdown { animation:bIn 520ms cubic-bezier(.16,1,.3,1) forwards; }
  .B .split i { transform-origin:left; }
  .B.run .split i, .B .breakdown .split i { animation:grow 700ms cubic-bezier(.16,1,.3,1) forwards; }
  @keyframes grow { from { transform:scaleX(0); } to { transform:scaleX(1); } }
  .B .split i:nth-child(1){animation-delay:60ms} .B .split i:nth-child(2){animation-delay:160ms}
  .B .split i:nth-child(3){animation-delay:260ms} .B .split i:nth-child(4){animation-delay:360ms}

  @media (prefers-reduced-motion:reduce){
    .A .card,.A tbody tr,.B .card,.B tbody tr{opacity:1!important;animation:none!important;transform:none!important}
    .B .split i{animation:none!important;transform:none!important}
  }
  @media (max-width:640px){ .top{grid-template-columns:1fr} .tag{display:none} :root{--gutter:12px} }
</style>
</head>
<body>
<div class="wrap">

  <div>
    <div class="labrow"><span class="lab">A</span><button class="replay" data-t="pa">Replay</button></div>
    <div class="shell A" id="pa"></div>
  </div>

  <div>
    <div class="labrow"><span class="lab">B</span><button class="replay" data-t="pb">Replay</button></div>
    <div class="shell B" id="pb"></div>
  </div>

</div>

<template id="tpl">
  <header class="aligned">
    <h1>Subscriptions</h1>
    <span class="meta">Updated 09:14 · 23 active</span>
  </header>
  <div class="top">
    <button class="card lead" aria-expanded="false">
      <div class="eyebrow">Monthly spend</div>
      <div class="amount" data-count="412.88">$412.88</div>
      <div class="delta">+$18.40 <span>vs. July · +4.7%</span></div>
      <div class="affordance">Breakdown ↓</div>
    </button>
    <div class="side">
      <div class="card"><span class="eyebrow">Renewing in 7d<span class="note">4 charges</span></span><span class="val">$96.47</span></div>
      <div class="card"><span class="eyebrow">Changed this month<span class="note">2 added, 1 cancelled</span></span><span class="val">+3</span></div>
    </div>
  </div>
  <div class="card breakdown" hidden>
    <div class="eyebrow">Monthly spend · by category</div>
    <div class="split">
      <i style="background:#1f4ed8;width:29%"></i><i style="background:#d97706;width:26%"></i>
      <i style="background:#5b21b6;width:25%"></i><i style="background:#16a34a;width:20%"></i>
    </div>
    <div class="legend">
      <span><i class="swatch" style="background:#1f4ed8"></i>Design<b>$119.94</b></span>
      <span><i class="swatch" style="background:#d97706"></i>Infra<b>$107.35</b></span>
      <span><i class="swatch" style="background:#5b21b6"></i>Work<b>$103.20</b></span>
      <span><i class="swatch" style="background:#16a34a"></i>Home<b>$82.39</b></span>
    </div>
  </div>
  <div class="sectionbar aligned"><span class="eyebrow">Upcoming charges</span><span class="hint">Next 30 days</span></div>
  <div class="card tablecard">
    <table>
      <thead><tr><th>Service</th><th>Plan</th><th>Charges</th><th>Amount</th></tr></thead>
      <tbody>
        <tr class="due"><td class="svc"><span class="dot due"></span>Adobe CC<span class="tag">design</span></td><td>Individual</td><td class="when">Aug 9 · in 2d</td><td class="amt">$29.99</td></tr>
        <tr class="due"><td class="svc"><span class="dot due"></span>AWS<span class="tag infra">infra</span></td><td>Pay-as-you-go</td><td class="when">Aug 11 · in 4d</td><td class="amt">$41.20</td></tr>
        <tr><td class="svc"><span class="dot"></span>Notion<span class="tag work">work</span></td><td>Plus, 3 seats</td><td>Aug 18</td><td class="amt">$24.00</td></tr>
        <tr><td class="svc"><span class="dot"></span>Spotify<span class="tag home">home</span></td><td>Duo</td><td>Aug 22</td><td class="amt">$16.99</td></tr>
        <tr><td class="svc"><span class="dot"></span>Figma<span class="tag">design</span></td><td>Professional</td><td>Aug 27</td><td class="amt">$15.00</td></tr>
      </tbody>
    </table>
  </div>
</template>

<script>
  const tpl = document.getElementById('tpl');
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function build(id){
    const host = document.getElementById(id);
    host.innerHTML = '';
    host.appendChild(tpl.content.cloneNode(true));
    const lead = host.querySelector('.lead');
    const bd   = host.querySelector('.breakdown');
    const aff  = host.querySelector('.affordance');
    lead.addEventListener('click', () => {
      const open = lead.getAttribute('aria-expanded') === 'true';
      lead.setAttribute('aria-expanded', String(!open));
      bd.hidden = open;
      aff.textContent = open ? 'Breakdown ↓' : 'Hide breakdown ↑';
    });
  }

  function countUp(host){
    const el = host.querySelector('.amount');
    const target = parseFloat(el.dataset.count);
    const dur = 420, t0 = performance.now();
    function frame(t){
      const p = Math.min((t - t0) / dur, 1);
      const eased = 1 - Math.pow(1 - p, 3);
      el.textContent = '$' + (target * eased).toFixed(2);
      if (p < 1) requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  function run(id){
    const host = document.getElementById(id);
    build(id);
    host.classList.remove('run');
    void host.offsetWidth;             // restart the animations
    host.classList.add('run');
    if (id === 'pb' && !reduced) countUp(host);
  }

  document.querySelectorAll('.replay').forEach(b =>
    b.addEventListener('click', () => run(b.dataset.t)));

  run('pa'); run('pb');
</script>
</body>
</html>
